<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     
    <h1>Employee Management System</h1>
    <form action="#">
        <!-- Name: -->
         <div class="inputContainer">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="" placeholder="Enter Name" required>
         </div>

          <!-- Age: -->
         <div class="inputContainer">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" value="" placeholder="Enter Age" required>
         </div>

          <!-- Salary: -->
         <div class="inputContainer">
            <label for="Salary">Salary:</label>
            <input type="number" id="Salary" name="Salary" value="" placeholder="Enter Salary" required>
         </div>

         <div class="inputContainer">
            <label for="emplopye">
                Employee type:
            </label>
            <select name="emplopye" id="employee">
                <option value="Employee">Employee</option>
                <option value="Manager">Manager</option>
            </select>
         </div>


         <!-- for Departmetn selct -->
          <div class="inputContainer">
            <label for="dep">Department:</label>
          <select name="dep" id="dep">
            <option value="software">software</option>
            <option value="IT">IT</option>
            <option value="design">Design</option>
          </select>
          </div>

          <button id="submit">Add Employee</button>
         

    </form>

    <div class="result"></div>

    
    <script src="script.js"></script>
</body>
</html>
